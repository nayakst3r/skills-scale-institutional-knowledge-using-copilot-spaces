[project]
name = "au-bank-ontology"
version = "0.3.0"
description = "Australian banking ontology with agentic maintenance, governance and a physical model layer"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "mcp>=1.0",
  "rdflib>=7.0",
  "pyshacl>=0.25",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.urls]
Attribution = "https://github.com/databricks-industry-solutions/lakehouse-industry-data-models"

[tool.setuptools]
packages = ["agent", "mcp_servers"]
