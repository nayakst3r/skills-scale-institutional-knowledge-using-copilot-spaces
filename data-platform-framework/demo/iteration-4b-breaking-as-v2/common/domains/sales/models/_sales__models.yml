version: 2
models:
  - name: sales_silver_orders
    description: One row per order, deduplicated and typed. Deprecated (sunset 2026-12-31), use sales_silver_orders_v2. Contract - contracts/orders.yaml
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]

  - name: sales_silver_orders_v2
    description: One row per order, with gross_amount. Replaces sales_silver_orders. Contract - contracts/orders_v2.yaml
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: gross_amount
        data_tests: [not_null]

  - name: sales_gold_revenue_daily
    description: Daily revenue per currency and channel. Public. Contract - contracts/revenue_daily.yaml
    data_tests:
      - unique_combination:
          arguments:
            columns: [order_date, currency, channel]
    columns:
      - name: order_date
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
