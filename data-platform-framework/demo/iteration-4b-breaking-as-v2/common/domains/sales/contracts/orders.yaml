# Data contract: the public API of a table. Changes need domain owner + platform review.
name: orders
domain: sales
layer: silver
version: 1.2.0            # MINOR bump: additive, NULLABLE column
owner: "@org/de-sales"
description: One row per order, deduplicated and typed from sales_bronze.raw_orders.
partition_by: order_date
cluster_by: [customer_id]
sla:
  freshness_hours: 6
columns:
  - { name: order_id,       type: string,    mode: REQUIRED, description: Natural key }
  - { name: customer_id,    type: string,    mode: REQUIRED }
  - { name: customer_email, type: string,    mode: NULLABLE, pii: true, policy_tag: pii_email }
  - { name: order_date,     type: date,      mode: REQUIRED }
  - { name: amount,         type: decimal,   mode: REQUIRED }
  - { name: currency,       type: string,    mode: REQUIRED }
  - { name: channel,        type: string,    mode: NULLABLE, description: Added in 1.1.0 }
  - { name: region,         type: string,    mode: NULLABLE, description: Added in 1.2.0 }
deprecated:
  replaced_by: orders_v2
  sunset_date: "2026-12-31"
