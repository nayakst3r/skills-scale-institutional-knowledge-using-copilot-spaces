name: revenue_eur_daily
domain: finance
layer: gold
version: 1.0.0
owner: "@org/de-finance"
description: Daily revenue converted to EUR, per channel. Feeds the EUR revenue dashboard.
partition_by: order_date
sla:
  freshness_hours: 10
columns:
  - { name: order_date,  type: date,    mode: REQUIRED }
  - { name: channel,     type: string,  mode: NULLABLE }
  - { name: order_count, type: integer, mode: REQUIRED }
  - { name: revenue_eur, type: decimal, mode: REQUIRED }
