data_platform:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:   # laptop: DuckDB + sample_data, no cloud needed
      type: duckdb
      path: target/local.duckdb
      threads: 4
    dev: &athena              # people: aws sso login; CI: OIDC role (standard AWS credential chain)
      type: athena
      region_name: "{{ env_var('AWS_REGION', 'eu-west-1') }}"
      s3_staging_dir: "{{ env_var('DE_ATHENA_RESULTS', 's3://set-DE_ATHENA_RESULTS/') }}"
      s3_data_dir: "{{ env_var('DE_LAKE_PATH', 's3://set-DE_LAKE_PATH/') }}"
      s3_data_naming: schema_table
      database: awsdatacatalog
      schema: default_schema  # unused: macros/naming.sql sets every schema
      work_group: "{{ env_var('DE_ATHENA_WORKGROUP', 'primary') }}"
      threads: 8
    ci: *athena
    stg: *athena
    prod: *athena
