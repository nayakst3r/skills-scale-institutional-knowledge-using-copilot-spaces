name: stack-validate
on:
  pull_request:
  merge_group:

permissions:
  contents: read
  id-token: write   # OIDC login to Google Cloud

jobs:
  stack-validate:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: ci
      DE_GCP_PROJECT: ${{ vars.DE_GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-stack.txt
      - name: "dbt parse (offline: SQL, refs, sources, tests)"
        run: dbt parse
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=platform/terraform init -backend=false && terraform -chdir=platform/terraform validate
      # Below runs only once GCP is connected (repo variables set). A skipped step still lets the job pass.
      - if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: vars.GCP_WIF_PROVIDER != ''
        name: dbt build --empty against BigQuery (compiles + runs every model with zero rows)
        run: dbt build --empty --exclude resource_type:seed
      - if: always() && vars.GCP_WIF_PROVIDER != ''
        run: dbt run-operation drop_ci_schemas
