name: cd
on:
  push:
    branches: [main]          # every merge -> stg
    tags: ["v*"]              # release tag -> prod (with approval)

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deploy mid-flight

jobs:
  deploy-stg:
    if: github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_STG }}
      # Infra, then Dataform, then DAGs: Cloud Build runs the same steps for parity with prod.
      - run: gcloud builds submit --config=platform/cloudbuild.yaml --substitutions=_ENV=stg,_SHA=${{ github.sha }} .

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v') && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: prod         # GitHub Environment with required reviewer = release captain
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_PROD }}
      - run: gcloud builds submit --config=platform/cloudbuild.yaml --substitutions=_ENV=prod,_SHA=${{ github.sha }} .
