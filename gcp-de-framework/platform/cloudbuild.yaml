# Single deploy pipeline used for every environment: only _ENV changes.
substitutions:
  _ENV: stg
  _SHA: local

steps:
  - id: terraform-apply
    name: hashicorp/terraform:1.9
    dir: platform/terraform
    entrypoint: sh
    args:
      - -c
      - terraform init -backend-config=env/${_ENV}.backend && terraform apply -auto-approve -var-file=env/${_ENV}.tfvars

  - id: dataform-run
    name: node:20
    entrypoint: sh
    args: ["-c", "npm i -g @dataform/cli && dataform run --vars=env=${_ENV} --run-tests"]
    waitFor: [terraform-apply]

  - id: sync-dags
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        BUCKET=$(gcloud composer environments describe de-composer-${_ENV} --location=europe-west2 --format='value(config.dagGcsPrefix)')
        for d in domains/*/dags; do gsutil -m rsync -r -d "$d" "$BUCKET/$(basename $(dirname $d))"; done
    waitFor: [dataform-run]

options:
  logging: CLOUD_LOGGING_ONLY
