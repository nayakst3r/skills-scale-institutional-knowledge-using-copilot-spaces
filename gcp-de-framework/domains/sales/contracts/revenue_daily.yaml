name: revenue_daily
domain: sales
layer: gold
version: 1.0.0
owner: "@org/de-sales"
description: Daily revenue per currency and channel. Consumed by Finance and Looker.
partition_by: order_date
sla:
  freshness_hours: 8
columns:
  - { name: order_date,  type: DATE,    mode: REQUIRED }
  - { name: currency,    type: STRING,  mode: REQUIRED }
  - { name: channel,     type: STRING,  mode: NULLABLE }
  - { name: order_count, type: INT64,   mode: REQUIRED }
  - { name: revenue,     type: NUMERIC, mode: REQUIRED }
