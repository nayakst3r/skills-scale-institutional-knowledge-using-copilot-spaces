# GitLab: include from .gitlab-ci.yml ->  include: { local: pipelines/plumbline.gitlab-ci.yml }
plumbline:
  image: python:3.12-slim
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script: [apt-get update -qq && apt-get install -y -qq git >/dev/null]
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - python .plumbline/plumbline.py --diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --format markdown -o plumbline.md || RC=$?
    - cat plumbline.md
    - exit ${RC:-0}
  artifacts:
    when: always
    paths: [plumbline.md]
