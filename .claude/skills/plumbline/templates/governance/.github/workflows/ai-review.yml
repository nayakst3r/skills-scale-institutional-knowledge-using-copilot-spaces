# AI architecture & quality review. Advisory input for the HUMAN reviewer, never a substitute:
# it can only comment and report blocking findings. It cannot approve. Merging always needs a human code owner.
# Needs repo secret ANTHROPIC_API_KEY. Repo variable AI_REVIEW_MODE = blocking (default) | advisory.
name: ai-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    name: ai-architecture-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Check credentials
        id: creds
        env: { KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          if [ -z "$KEY" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::ANTHROPIC_API_KEY not set - AI review skipped"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}

            You are the AI pre-reviewer for this repository. The PR branch is checked out. A human code owner makes
            the decision; your job is to make their review faster and sharper. You never approve or merge.
            Several engineers work here in parallel with AI agents; your job is to keep the codebase true to its
            agreed architecture and free of low-quality AI output.

            1. Read ARCHITECTURE.md, AGENTS.md, AI_POLICY.md and every accepted ADR in docs/adr/.
            2. Read the diff with `gh pr diff ${{ github.event.pull_request.number }}` and the PR description with `gh pr view`.
            3. Run `python3 .plumbline/plumbline.py --diff ${{ github.event.pull_request.base.sha }}` and do not repeat its findings.
            4. Review against:
               - Architecture: responsibilities match the module; no logic in the wrong layer; conventions in
                 ARCHITECTURE.md section 7 followed; no parallel duplicates of existing utilities; decisions in ADRs respected.
               - Grounding: every API, package, flag and config key used exists (grep the repo / lockfiles).
               - Real implementation: nothing stubbed, faked or silently narrowed from the linked issue.
               - Tests: they would fail if the code were wrong.
               - Security and data handling per AI_POLICY.md.
               - Scope: matches the linked issue; no drive-by changes; PR description claims are backed by the code.
            5. Post specific problems as inline comments with mcp__github_inline_comment__create_inline_comment (confirmed: true).
            6. Post ONE top-level summary with `gh pr comment` titled "AI pre-review (human approval still required)".
               Include a section "For the human reviewer" listing the 3-5 places a human should look hardest and
               any claim in the PR you could not verify. End with exactly one of these lines:
               PLUMBLINE-VERDICT: no-blocking-findings
               PLUMBLINE-VERDICT: blocking-findings
               Use blocking-findings only for architecture violations, invented APIs or packages, stubs, tests that
               cannot fail, or security/data-policy problems. Style nits never block.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(python3 .plumbline/plumbline.py:*),Bash(git log:*),Bash(git diff:*)"
      - name: Enforce verdict
        if: steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.AI_REVIEW_MODE || 'blocking' }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          verdict=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | contains("PLUMBLINE-VERDICT:"))] | last | .body' \
                    | grep -o 'PLUMBLINE-VERDICT: [a-z-]*' | tail -1 | cut -d' ' -f2)
          echo "AI review verdict: ${verdict:-none} (mode: $MODE)"
          if [ "$MODE" = "blocking" ] && [ "$verdict" != "no-blocking-findings" ]; then
            echo "::error::AI pre-review reported blocking findings (verdict: ${verdict:-missing}). Fix them; a human still approves the PR."
            exit 1
          fi
          echo "AI pre-review passed. This does not approve the PR - a human code owner must."
