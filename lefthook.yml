# Generated by `plumbline hooks` — regenerate with `plumbline hooks --write`.
# Local, personal overrides go in lefthook-local.yml (git-ignored).

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: plumbline-gate
      run: python3 .plumbline/plumbline.py --staged
    - name: ruff
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      exclude:
        - ".plumbline/**"
        - ".claude/skills/**"
      glob: "*.py"
      stage_fixed: true

commit-msg:
  jobs:
    - name: ai-provenance-trailer
      run: python3 .plumbline/plumbline.py --commit-msg {1}

pre-push:
  jobs:
    - name: plumbline-gate-branch
      run: python3 .plumbline/plumbline.py --diff origin/plumbline-demo
